<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        console.log(Math.floor(8.7)); // 向下取整
        console.log(Math.round(8.7)); // 四舍五入
        console.log(Math.random()); // 生成0-1之间的随机数
        function getRandomNum(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        console.log(getRandomNum(100, 900)); // 生成100-900之间的随机数
        var data = new Date();
        console.log(data.getFullYear()); // 获取年份
        console.log(data.getMonth() + 1); // 获取月份，注意月份是从0开始的，所以要加1
        console.log(data.getDate()); // 获取日期
        console.log(data.getDay()); // 获取星期几，0是星期天，1是星期一，依次类推
        console.log(data.getHours()); // 获取小时
        console.log(data.getMinutes()); // 获取分钟
        console.log(data.getSeconds()); // 获取秒数
        console.log(data.getTime()); // 获取时间戳

        //数组对象
        var arr = [1, 2, 3, 4, 'five', 'six', 'seven'];
        var arr2 = new Array(8, 9, 10, 11, 'twelve', 'thirteen', 'fourteen');
        console.log(arr); 
        console.log(arr2);    
        console.log(new Array(5)); // 创建一个长度为5的空数组
        
    </script>
</body>
</html>
