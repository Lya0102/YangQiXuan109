<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的音乐</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#f4f4f4;padding-bottom:70px;}
        .user-info{background:linear-gradient(135deg,#ec4141,#ff7474);color:#fff;padding:30px 20px;}
        .user-name{font-size:20px;font-weight:bold;margin-bottom:8px;}
        .sub-text{font-size:13px;opacity:0.9;}
        .list-title{padding:15px;font-size:16px;font-weight:bold;}
        .mylist{background:#fff;margin:0 12px;border-radius:8px;padding:14px;}
        .mylist p{font-size:14px;color:#333;line-height:1.6;}
        /* Tab */
        .tab{position:fixed;bottom:0;left:0;width:100%;height:62px;background:#fff;display:flex;border-top:1px solid #ddd;}
        .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:#777;text-decoration:none;}
        .tab-item img{width:24px;height:24px;margin-bottom:4px;}
    </style>
</head>
<body>
    <div class="user-info">
        <div class="user-name">云音乐用户</div>
        <div class="sub-text">喜欢的歌：12首</div>
    </div>
    <div class="list-title">我创建的歌单</div>
    <div class="mylist">
        <p>✨ 收藏 · 治愈歌单</p>
    </div>

    <div class="tab">
        <a href="index.html" class="tab-item">
            <img src="find.png">
            <span>发现</span>
        </a>
        <a href="rank.html" class="tab-item">
            <img src="rank.png">
            <span>排行</span>
        </a>
        <a href="search.html" class="tab-item">
            <img src="search.png">
            <span>搜索</span>
        </a>
        <a href="my.html" class="tab-item active">
            <img src="user.png">
            <span>我的</span>
        </a>
    </div>
</body>
</html>
